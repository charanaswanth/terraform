---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mydemo
  name: demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      namespace: mydemo
      name: demo
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo
        image: nginx:mainline-alpine
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  namespace: mydemo
  name: demo
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer